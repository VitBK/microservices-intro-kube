apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Values.namespace }}
  name: resources-ms-config-map
  labels:
    {{- include "resources-service.labels" . | nindent 4 }}
data:
  SONGS_MS_URL: "songs-ms-service"
  SONGS_MS_PORT: "8080"
  RESOURCES_DB_URL: "resources-ms-db-statefulset-0.resources-ms-db-service"
  RESOURCES_DB_PORT: "5432"
  init.sql: |
    CREATE TABLE IF NOT EXISTS resources (
        id SERIAL PRIMARY KEY,
        blob BYTEA
    );
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: resources-ms-secrets
  labels:
    {{- include "resources-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USERNAME: cG9zdGdyZXM=
  DB_PASSWORD: cG9zdGdyZXM=
